name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or limitation should be addressed?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What result would make this successful?
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Suggested approach
      description: Describe an approach, alternatives, or constraints.
  - type: textarea
    id: validation
    attributes:
      label: Acceptance criteria
      description: How will we know the feature is complete and correct?